<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6efd8"/>
      <stop offset="55%" stop-color="#eee3bd"/>
      <stop offset="100%" stop-color="#e9dfaa"/>
    </linearGradient>
    <linearGradient id="terraceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6a4c"/>
      <stop offset="100%" stop-color="#6c4f37"/>
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f6b45"/>
      <stop offset="100%" stop-color="#294b2e"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a8a52"/>
      <stop offset="100%" stop-color="#3c6a3f"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3c463" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f3c463" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="620" fill="url(#skyGrad)"/>
  <circle cx="740" cy="130" r="140" fill="url(#sunGlow)"/>
  <circle cx="740" cy="130" r="46" fill="#f6c463"/>

  <!-- distant hills -->
  <path d="M0,300 Q150,255 320,285 T650,270 T900,300 L900,620 L0,620 Z" fill="#cdd8b6" opacity="0.7"/>

  <!-- terrace levels -->
  <rect x="0" y="360" width="900" height="60" fill="url(#terraceGrad)"/>
  <rect x="0" y="360" width="900" height="10" fill="#a9835f"/>

  <rect x="0" y="470" width="900" height="70" fill="url(#terraceGrad)"/>
  <rect x="0" y="470" width="900" height="10" fill="#a9835f"/>

  <rect x="0" y="550" width="900" height="70" fill="#5c4531"/>

  <!-- terracotta pots row 1 -->
  <g>
    <g transform="translate(90,300)">
      <path d="M-32,60 L32,60 L24,0 L-24,0 Z" fill="#b5673e"/>
      <ellipse cx="0" cy="0" rx="26" ry="7" fill="#9c5731"/>
      <path d="M0,0 C-30,-40 -50,-90 -10,-130 C10,-95 12,-55 0,0 Z" fill="url(#leafGrad1)"/>
      <path d="M0,0 C20,-45 46,-80 20,-120 C-2,-90 -8,-45 0,0 Z" fill="url(#leafGrad2)"/>
    </g>
    <g transform="translate(230,320)">
      <path d="M-40,70 L40,70 L30,0 L-30,0 Z" fill="#c07a4d"/>
      <ellipse cx="0" cy="0" rx="32" ry="8" fill="#9c5731"/>
      <path d="M0,-4 C-40,-30 -60,-70 -30,-115 C0,-90 15,-45 0,-4 Z" fill="url(#leafGrad2)"/>
      <path d="M0,-4 C30,-35 55,-65 35,-110 C5,-85 -5,-40 0,-4 Z" fill="url(#leafGrad1)"/>
    </g>
    <g transform="translate(390,300)">
      <path d="M-30,60 L30,60 L22,0 L-22,0 Z" fill="#b5673e"/>
      <ellipse cx="0" cy="0" rx="25" ry="7" fill="#9c5731"/>
      <path d="M0,0 C-24,-36 -40,-80 -6,-118 C10,-84 10,-46 0,0 Z" fill="url(#leafGrad1)"/>
    </g>
  </g>

  <!-- terrace level 2 pots -->
  <g>
    <g transform="translate(560,420)">
      <path d="M-36,66 L36,66 L27,0 L-27,0 Z" fill="#c07a4d"/>
      <ellipse cx="0" cy="0" rx="29" ry="7" fill="#9c5731"/>
      <path d="M0,-2 C-34,-28 -55,-66 -22,-105 C2,-80 12,-40 0,-2 Z" fill="url(#leafGrad2)"/>
      <path d="M0,-2 C26,-30 48,-60 26,-100 C0,-78 -8,-38 0,-2 Z" fill="url(#leafGrad1)"/>
    </g>
    <g transform="translate(700,430)">
      <path d="M-30,58 L30,58 L22,0 L-22,0 Z" fill="#b5673e"/>
      <ellipse cx="0" cy="0" rx="25" ry="6" fill="#9c5731"/>
      <path d="M0,0 C-22,-30 -36,-65 -4,-100 C10,-72 10,-38 0,0 Z" fill="url(#leafGrad1)"/>
    </g>
    <g transform="translate(120,440)">
      <path d="M-34,62 L34,62 L25,0 L-25,0 Z" fill="#c07a4d"/>
      <ellipse cx="0" cy="0" rx="27" ry="7" fill="#9c5731"/>
      <path d="M0,-2 C-28,-30 -46,-68 -12,-104 C6,-78 10,-40 0,-2 Z" fill="url(#leafGrad2)"/>
    </g>
  </g>

  <!-- watering can silhouette -->
  <g transform="translate(790,510)" opacity="0.9">
    <path d="M0,20 L60,20 L58,0 L4,0 Z" fill="#4a6b4d"/>
    <rect x="4" y="20" width="54" height="14" rx="3" fill="#3d5940"/>
    <path d="M55,4 L80,-14" stroke="#3d5940" stroke-width="8" stroke-linecap="round"/>
    <path d="M4,4 Q-14,-8 -22,4" stroke="#3d5940" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- string lights across the top -->
  <path d="M40,60 Q450,140 860,50" stroke="#8a6a4c" stroke-width="2" fill="none" opacity="0.5"/>
  <circle cx="180" cy="92" r="5" fill="#f6c463"/>
  <circle cx="330" cy="115" r="5" fill="#f6c463"/>
  <circle cx="480" cy="122" r="5" fill="#f6c463"/>
  <circle cx="630" cy="108" r="5" fill="#f6c463"/>
  <circle cx="760" cy="80" r="5" fill="#f6c463"/>
</svg>
